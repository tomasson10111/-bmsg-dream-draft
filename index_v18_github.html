<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#253463 0,#0a1024 34%,#050710 78%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:600px;margin:auto;padding:16px 12px 38px}.eyebrow{text-align:center;font-size:10px;letter-spacing:.28em;color:#83eaff;font-weight:900}.title{text-align:center;font-size:29px;font-weight:1000;letter-spacing:.04em;margin:3px 0;text-shadow:0 0 24px #527cff}.sub{text-align:center;color:#9daaca;font-size:11px;margin-bottom:12px}.hud{display:flex;justify-content:space-between;background:#0d1428dd;border:1px solid #2b3b67;border-radius:13px;padding:9px 12px;margin-bottom:9px}.round{font-weight:1000}.phase{font-size:11px;color:#9edfff;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.card{position:relative;padding:0;border:1px solid #334a7a;background:#10182d;color:#fff;border-radius:13px;overflow:hidden;min-width:0;box-shadow:0 8px 22px #0008;transition:.12s}.card:active{transform:scale(.96)}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.meta{padding:6px 2px 7px;text-align:center}.name{font-size:10px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group{font-size:6px;color:#8eeaff;margin-top:1px;white-space:nowrap}.selectTag{position:absolute;top:5px;left:5px;background:#050817d9;border:1px solid #62eaff;border-radius:99px;padding:3px 5px;font-size:6px;font-weight:1000}.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.teamBox{background:#0b1121b8;border:1px solid #26385f;border-radius:12px;padding:7px}.teamTitle{font-size:9px;font-weight:1000;letter-spacing:.1em;margin-bottom:5px}.p1{color:#70dcff}.p2{color:#e593ff}.team{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.slot{aspect-ratio:3/4;border:1px dashed #35466b;border-radius:5px;overflow:hidden;position:relative;background:#0b1020}.slot img{width:100%;height:100%;object-fit:cover}.slo /* v12 DRAFT CALL + contested pick countdown */

.callRound{font-size:11px;font-weight:1000;letter-spacing:.2em;color:#8deeff;margin-bottom:18px}.callPlayer{font-size:30px;font-weight:1000;margin-bottom:10px}.callText{font-size:14px;color:#c4cce0;line-height:1.8}.callDots{font-size:28px;letter-spacing:.2em;margin:7px 0 4px;color:#fff;text-shadow:0 0 16px #76ddff}.contestMember{width:min(150px,42vw);aspect-ratio:3/4;border-radius:14px;object-fit:cover;margin:10px 0;border:2px solid #ffdf68;box-shadow:0 0 22px #ffcb3f77}.contestTitle{font-size:34px;font-weight:1000;color:#ffe46d;text-shadow:0 0 12px #fff4a6,0 0 32px #ff9f00;margin:2px 0}.versus{font-size:20px;font-weight:1000;line-height:1.6}.countNum{font-size:96px;line-height:1;font-weight:1000;color:#fff;text-shadow:0 0 18px #fff,0 0 45px #66dfff;animation:countPop .55s both}.countLabel{font-size:11px;letter-spacing:.2em;color:#a9eaff;font-weight:1000;margin-bottom:14px}@keyframes countPop{0%{opacity:0;transform:scale(1.8)}45%{opacity:1;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.flipCard{animation:none;transform:rotateY(180deg)}.winStage::before,.winStage::after,.winBurst,.winPlayer{animation:none}}

/* v15 automatic sequential pick reveal */
.pickRevealList{width:100%;max-width:420px;margin:14px auto;display:grid;gap:10px}.pickRevealRow{display:flex;align-items:center;gap:12px;padding:9px 10px;border:1px solid #263453;border-radius:14px;background:#0d1426;opacity:.38;transition:opacity .3s,transform .3s;transform:scale(.97)}.pickRevealRow.active,.pickRevealRow.done{opacity:1;transform:scale(1)}.pickWho{width:92px;text-align:left;font-size:15px;font-weight:1000;flex:0 0 auto}.miniFlipWrap{height:70px;flex:1;perspective:700px;min-width:0}.miniFlip{height:100%;position:relative;transform-style:preserve-3d}.pickRevealRow.active .miniFlip{animation:miniCardFlip .72s cubic-bezier(.2,.8,.2,1) forwards}.pickRevealRow.done .miniFlip{transform:rotateY(180deg)}.miniFace{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;border:1px solid #506da5}.miniBack{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#172243,#34245e 52%,#126a89);font-size:15px;font-weight:1000;letter-spacing:.14em;color:#dffaff;text-shadow:0 0 12px #6eeaff}.miniFront{transform:rotateY(180deg);display:flex;align-items:center;background:#111a31}.miniFront img{width:70px;height:70px;object-fit:cover;display:block}.miniPickName{font-size:20px;font-weight:1000;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pickRevealStatus{min-height:80px;display:flex;flex-direction:column;justify-content:center}.pickRevealStatus .go{margin-top:10px}@keyframes miniCardFlip{0%{transform:rotateY(0) scale(.94)}35%{transform:rotateY(0) scale(1.03)}100%{transform:rotateY(180deg) scale(1)}}

.finalShowcase::before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent 0 8%,#72efff55 12%,transparent 18% 34%,#a976ff55 40%,transparent 47% 63%,#ffe36b44 69%,transparent 76%);animation:finalSpin 3.4s linear infinite;mix-blend-mode:screen}.finalShowcase>*{position:relative;z-index:1}.finalKicker{font-size:10px;letter-spacing:.25em;color:#9cefff;font-weight:1000}.finalPlayer{font-size:38px;font-weight:1000;margin:5px 0 0;text-shadow:0 0 24px currentColor}.finalDream{font-size:15px;font-weight:1000;letter-spacing:.18em;margin:0 0 16px;color:#fff}.finalSeven{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:390px;margin:auto}.finalMember{opacity:0;transform:translateY(18px) scale(.72);border-radius:11px;overflow:hidden;background:#0d1630;border:1px solid #76eaff99;box-shadow:0 0 0 transparent}.finalMember.reveal{animation:memberBang .48s cubic-bezier(.18,.85,.28,1.25) forwards}.finalMember:nth-child(5){grid-column:1/2}.finalMember img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.finalMemberName{font-size:8px;font-weight:1000;padding:5px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finalComplete{opacity:0;margin-top:16px;font-size:25px;font-weight:1000;color:#ffe76c;text-shadow:0 0 10px #fff3a0,0 0 28px #ffcf33}.finalComplete.on{animation:winPop .55s forwards}.finalProgress{font-size:10px;color:#a8b5d5;margin-top:6px}.finalSkip{margin-top:14px;border:1px solid #526b9e;border-radius:11px;padding:9px 16px;background:#111b34;color:#c8d2e9;font-weight:900}.finalBoom{animation:finalBoom .35s ease-out}.finalResultIn{animation:resultIn .55s ease-out}.finalBox{animation:resultIn .5s ease-out both}.finalBox:nth-child(2){animation-delay:.08s}.finalBox:nth-child(3){animation-delay:.16s}.finalBox:nth-child(4){animation-delay:.24s}
@keyframes finalSpin{to{transform:rotate(360deg)}}
@keyframes memberBang{0%{opacity:0;transform:translateY(18px) scale(.55);filter:brightness(2)}65%{opacity:1;transform:translateY(-3px) scale(1.08);box-shadow:0 0 18px #6eeaffaa,0 0 32px #8d68ff66}100%{opacity:1;transform:none;box-shadow:0 0 12px #5edfff55}}

</style></head><body><div class="flash" id="flash"></div>
<div class="titleScreen" id="titleScreen"><div class="titlePanel"><img class="titleHero" src="title_bmsgfes2026.jpg" alt="BMSG FES 2026"><div class="eyebrow">BMSG FAN GAME · v17 TEAM SHOWCASE</div><div class="title" style="font-size:38px">DREAM DRAFT</div><div class="sub">28人から、それぞれ7人のDREAM TEAMを作れ。</div><div class="modeBtns"><button class="modeBtn" onclick="selectMode(2)">2人プレイ<small>2 PLAYERS</small></button><button class="modeBtn" onclick="selectMode(3)">3人プレイ<small>3 PLAYERS</small></button><button class="modeBtn" onclick="selectMode(4)">4人プレイ<small>4 PLAYERS</small></button></div></div></div>

<section class="play" id="play"><div class="hud"><div class="round" id="round">ROUND 1 / 7</div><div class="phase" id="phase"></div></div><div class="cards" id="cards"></div><div class="teams multi" id="teams"></div><div class="rule">4人ずつ公開。指名が被ったら抽選。外れたPLAYERは残っているメンバーから再指名。</div><button class="backTitle" onclick="backTitle()">タイトルへ戻る</button></section>

<script>
const MEMBERS=[{"name":"MANATO","group":"BE:FIRST","img":"01.jpg"},{"name":"SOTA","group":"BE:FIRST","img":"02.jpg"},{"name":"RYUHEI","group":"BE:FIRST","img":"03.jpg"},{"name":"LEO","group":"BE:FIRST","img":"04.jpg"},{"name":"JUNON","group":"BE:FIRST","img":"05.jpg"},{"name":"SHUNTO","group":"BE:FIRST","img":"06.jpg"},{"name":"KAIRYU","group":"MAZZEL","img":"07.jpg"},{"name":"NAOYA","group":"MAZZEL","img":"08.jpg"},{"name":"RAN","group":"MAZZEL","img":"10.jpg"},{"name":"SEITO","group":"MAZZEL","img":"09.jpg"},{"name":"RYUKI","group":"MAZZEL","img":"11.jpg"},{"name":"TAKUTO","group":"MAZZEL","img":"12.jpg"},{"name":"HAYATO","group":"MAZZEL","img":"13.jpg"},{"name":"EIKI","group":"MAZZEL","img":"14.jpg"},{"name":"RUI","group":"STARGLOW","img":"15.jpg"},{"name":"TAIKI","group":"STARGLOW","img":"16.jpg"},{"name":"KANON","group":"STARGLOW","img":"17.jpg"},{"name":"GOICHI","group":"STARGLOW","img":"18.jpg"},{"name":"ADAM","group":"STARGLOW","img":"19.jpg"},{"name":"SKY-HI","group":"ARTIST","img":"20.jpg"},{"name":"Aile The Shota","group":"ARTIST","img":"21.jpg"},{"name":"Novel Core","group":"ARTIST","img":"22.jpg"},{"name":"edhiii boi","group":"ARTIST","img":"23.jpg"},{"name":"REIKO","group":"ARTIST","img":"24.jpg"},{"name":"Ayumu Imazu","group":"ARTIST","img":"25.jpg"},{"name":"YUTA","group":"4th TRAINEE","img":"26.jpg"},{"name":"KEI","group":"4th TRAINEE","img":"27.jpg"},{"name":"RAIKI","group":"4th TRAINEE","img":"28.jpg"},{"name":"TAICHI","group":"4th TRAINEE","img":"29.jpg"},{"name":"KANTA","group":"4th TRAINEE","img":"30.jpg"}];
const ACTIVE=MEMBERS.filter(m=>!['SKY-HI','Ayumu Imazu'].includes(m.name));
const PLAYER_NAMES=['トマソン','ほなみ','お母さん','うう','ゲスト'];let playerNames=[];let playerCount=2,rounds=[],r=0,teams=[],available=[],pendingPlayers=[],wavePicks={},pickPos=0,roundAcquired=[];const $=s=>document.querySelector(s);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
window.selectMode=n=>{playerCount=n;playerNames=Array(n).fill('');$('#titleScreen').classList.add('hide');showNameSelect()}
window.backTitle=()=>{$('#overlay').classList.remove('show');$('#nameScreen').classList.remove('show');$('#result').classList.remove('show');$('#play').classList.remove('hide');$('#titleScreen').classList.remove('hide')}
function pn(i){return playerNames[i]||`PLAYER ${i+1}`}
function showNameSelect(){$('#nameScreen').classList.add('show');$('#nameGuide').textContent=`${playerCount}人のプレイヤーを選んでください。`;renderNameSlots()}
function renderNameSlots(){$('#nameSlots').innerHTML=Array.from({length:playerCount},(_,pi)=>`<div class="nameSlot"><div class="nameSlotTitle ${pc(pi)}">PLAYER ${pi+1}</div><div class="nameChoices">${PLAYER_NAMES.map(n=>{let used=playerNames.includes(n)&&playerNames[pi]!==n;return `<button class="nameBtn ${playerNames[pi]===n?'selected':''}" ${used?'disabled':''} data-pi="${pi}" data-name="${n}">${n}</button>`}).join('')}</div></div>`).join('');document.querySelectorAll('.nameBtn').forEach(b=>b.onclick=()=>{playerNames[+b.dataset.pi]=b.dataset.name;renderNameSlots()});$('#startDraft').disabled=playerNames.some(n=>!n)}
$('#startDraft').onclick=()=>{$('#nameScreen').classList.remove('show');start()};$('#nameBack').onclick=()=>{$('#nameScreen').classList.remove('show');$('#titleScreen').classList.remove('hide')};
function start(){let a=shuffle(ACTIVE);rounds=Array.from({length:7},(_,i)=>a.slice(i*4,i*4+4));r=0;teams=Array.from({length:playerCount},()=>[]);$('#play').classList.remove('hide');$('#result').classList.remove('show');$('#eyebrow').textContent=`BMSG FAN GAME / ${playerCount} PLAYERS`;$('#subtitle').textContent=`28人を4人ずつ公開。${playerCount}人でそれぞれ7人組を作れ。`;renderTeams();beginRound()}
function pc(i){return 'playerColor'+i}
function renderTeams(){$('#teams').innerHTML=teams.map((t,pi)=>`<div class="teamBox"><div class="teamTitle ${pc(pi)}">${pn(pi)} TEAM</div><div class="team">${Array.from({length:7},(_,i)=>{let m=t[i];return `<div class="slot">${m?`<img src="${m.img}"><span>${m.name}</span>`:''}</div>`}).join('')}</div></div>`).join('')}
function renderCards(list=available){$('#round').textContent=`ROUND ${r+1} / 7`;$('#cards').innerHTML=list.map(m=>`<button class="card" onclick="pick(${JSON.stringify(m.name).replaceAll('"','&quot;')})"><span class="selectTag">SELECT</span><img src="${m.img}"><div class="meta"><div class="name">${m.name}</div><div class="group">${m.group}</div></div></button>`).join('')}
function beginRound(){available=[...rounds[r]];pendingPlayers=Array.from({length:playerCount},(_,i)=>i);wavePicks={};pickPos=0;roundAcquired=Array(playerCount).fill(null);showHandoff()}
function showHandoff(){let pi=pendingPlayers[pickPos];$('#overlay').classList.add('show');$('#panel').innerHTML=`<div class="eyebrow">ROUND ${r+1}${pendingPlayers.length<playerCount?' · RE-PICK':''}</div><div class="big ${pc(pi)}">${pn(pi)}</div><div class="msg">スマホを${pn(pi)}へ。<br>相手に見えないように1人選んでください。</div><button class="go" onclick="beginPick()">候補を見る</button>`}
window.beginPick=()=>{let pi=pendingPlayers[pickPos];$('#overlay').classList.remove('show');$('#phase').textContent=`${pn(pi)} ${pendingPlayers.length<playerCount?'RE-PICK':'SELECT'}`;renderCards(available)}
window.pick=name=>{let m=available.find(x=>x.name===name);if(!m)return;let pi=pendingPlayers[pickPos];wavePicks[pi]=m;if(pickPos<pendingPlayers.length-1){pickPos++;showHandoff()}else showPickResultGate()}
function showPickResultGate(){
  $('#overlay').classList.add('show');
  const repick=pendingPlayers.length<playerCount;
  $('#panel').innerHTML=`<div class="callStage"><div class="callRound">ROUND ${r+1}${repick?' · RE-PICK':''}</div><div class="big">全員の指名完了</div><div class="msg">スマホをみんなで見られるようにしてください。<br>タップすると指名結果を公開します。</div><button class="go" id="showPickResult">指名結果を見る</button></div>`;
  $('#showPickResult').onclick=resolveWave;
}
function resolveWave(){let byName={};pendingPlayers.forEach(pi=>{let m=wavePicks[pi];(byName[m.name]??=[]).push(pi)});let conflicts=[];let normals=[];let nextPending=[];for(const [name,players] of Object.entries(byName)){let m=available.find(x=>x.name===name);if(players.length===1){let pi=players[0];teams[pi].push(m);roundAcquired[pi]=m;available=available.filter(x=>x.name!==name);normals.push({m,player:pi})}else{let winner=players[Math.floor(Math.random()*players.length)];teams[winner].push(m);roundAcquired[winner]=m;available=available.filter(x=>x.name!==name);let losers=players.filter(x=>x!==winner);nextPending.push(...losers);conflicts.push({m,winner,players,losers})}}
renderTeams();pendingPlayers=nextPending;pickPos=0;normalQueue=normals;conflictQueue=conflicts;showWaveResults()}
function showWaveResults(){
  const picks=Object.entries(wavePicks).map(([pi,m])=>({player:Number(pi),m}));
  const hasConflict=conflictQueue.length>0;
  const rows=picks.map((x,i)=>`<div class="pickRevealRow" id="pickReveal${i}"><div class="pickWho ${pc(x.player)}">${pn(x.player)}</div><div class="miniFlipWrap"><div class="miniFlip"><div class="miniFace miniBack">DRAFT PICK</div><div class="miniFace miniFront"><img src="${x.m.img}" alt="${x.m.name}"><div class="miniPickName">${x.m.name}</div></div></div></div></div>`).join('');
  $('#panel').innerHTML=`<div class="callStage"><div class="callRound">ROUND ${r+1} · PICK RESULT</div><div class="big">指名結果</div><div class="msg">指名カードを公開します</div><div class="pickRevealList">${rows}</div><div class="pickRevealStatus" id="pickRevealStatus"><div class="msg">・・・</div></div></div>`;
  let i=0;
  const revealNext=()=>{
    if(i>=picks.length){
      setTimeout(()=>{
        $('#pickRevealStatus').innerHTML=`${hasConflict?'<div class="contestTitle" style="font-size:24px">指名が重なった！</div>':'<div class="msg" style="font-size:16px">指名競合なし！</div>'}<button class="go" id="afterPickResult">${hasConflict?'競合結果を見る':'指名確定へ'}</button>`;
        $('#afterPickResult').onclick=()=>{wavePicks={};runAcquisitionSequence()};
      },500);
      return;
    }
    const row=$('#pickReveal'+i); row.classList.add('active'); flash();
    setTimeout(()=>{row.classList.remove('active');row.classList.add('done');i++;setTimeout(revealNext,380)},760);
  };
  setTimeout(revealNext,550);
}
let conflictQueue=[],normalQueue=[];
function runAcquisitionSequence(){if(normalQueue.length)return showDraftCall(normalQueue.shift());if(conflictQueue.length)return showConflictIntro(conflictQueue.shift());continueAfterAcquisitions()}
function showDraftCall(x){
  $('#overlay').classList.add('show');
  $('#panel').innerHTML=`<div class="callStage"><div class="callRound">ROUND ${r+1} · DRAFT CALL</div><div class="callPlayer ${pc(x.player)}">${pn(x.player)}</div><div class="callText">第${r+1}巡 選択希望メンバー……</div><div class="callDots">・・・</div><div class="msg" style="margin-top:14px">指名カード OPEN</div></div>`;
  setTimeout(()=>showNormalWinner(x),850);
}
function showNormalWinner(x){
  $('#panel').innerHTML=`<div class="winStage"><div class="winBurst"></div><div class="winLabel">ROUND ${r+1} · DRAFT PICK</div><div class="flipWrap"><div class="flipCard"><div class="flipFace flipBack"></div><div class="flipFace flipFront"><img src="${x.m.img}" alt="${x.m.name}"><div class="winName">${x.m.name}</div></div></div></div><div class="winPlayer ${pc(x.player)}">${pn(x.player)} GET!</div><div class="msg" style="margin-top:6px">${x.m.group}</div></div>`;
  flash(); setTimeout(runAcquisitionSequence,1650);
}
function showConflictIntro(c){
  $('#overlay').classList.add('show');
  $('#panel').innerHTML=`<div class="callStage"><div class="callRound">ROUND ${r+1} · DRAFT LOTTERY</div><div class="contestTitle">指名競合！</div><img class="contestMember" src="${c.m.img}" alt="${c.m.name}"><div class="big">${c.m.name}</div><div class="versus">${c.players.map(x=>`<span class="${pc(x)}">${pn(x)}</span>`).join(' <span style="color:#7f8cab">VS</span> ')}</div><button class="go" id="lotteryStart">抽選へ</button></div>`;
  $('#lotteryStart').onclick=()=>startCountdown(c,3);
}
function startCountdown(c,n){
  if(n<=0)return showWinnerReveal(c);
  $('#panel').innerHTML=`<div class="callStage"><div class="countLabel">DRAFT LOTTERY</div><div class="countNum">${n}</div><div class="big">${c.m.name}</div><div class="msg">${c.players.map(x=>pn(x)).join(' / ')}</div></div>`;
  setTimeout(()=>startCountdown(c,n-1),620);
}
function showWinnerReveal(c){
  $('#panel').innerHTML=`<div class="winStage"><div class="winBurst"></div><div class="winLabel">DRAFT LOTTERY · WINNER</div><div class="flipWrap"><div class="flipCard"><div class="flipFace flipBack"></div><div class="flipFace flipFront"><img src="${c.m.img}" alt="${c.m.name}"><div class="winName">${c.m.name}</div></div></div></div><div class="winPlayer">${pn(c.winner)} GET!</div><div class="msg" style="margin-top:6px">${c.players.map(x=>pn(x)).join(' / ')} の指名が重複</div><button class="go" id="revealNext">次へ</button></div>`;
  flash(); $('#revealNext').onclick=runAcquisitionSequence;
}
function continueAfterAcquisitions(){if(pendingPlayers.length)showHandoff();else showReveal()}
function showReveal(){$('#overlay').classList.add('show');let lines=roundAcquired.map((m,pi)=>`<b class="${pc(pi)}">${pn(pi)}</b> → ${m?.name||'-'}`).join('<br>');$('#panel').innerHTML=`<div class="eyebrow">ROUND ${r+1} COMPLETE</div><div class="big">獲得完了！</div><div class="msg">${lines}</div><button class="go" onclick="nextRound()">${r===6?'結果を見る':'次のROUNDへ'}</button>`}
window.nextRound=()=>{r++;if(r>=7)return finish();beginRound()}
let finalShowTimer=null;
function finish(){
  $('#play').classList.add('hide');$('#result').classList.remove('show');
  $('#overlay').classList.add('show');
  showFinalTeam(0);
}
function showFinalTeam(pi){
  if(pi>=playerCount)return showFinalResults();
  const t=teams[pi];
  $('#panel').innerHTML=`<div class="finalShowcase" id="finalShowcase"><div class="finalKicker">DRAFT COMPLETE · TEAM ${pi+1}/${playerCount}</div><div class="finalPlayer ${pc(pi)}">${pn(pi)}</div><div class="finalDream">DREAM TEAM</div><div class="finalSeven">${t.map((m,i)=>`<div class="finalMember" id="fm${i}"><img src="${m.img}" alt="${m.name}"><div class="finalMemberName">${m.name}</div></div>`).join('')}</div><div class="finalComplete" id="finalComplete">TEAM COMPLETE!</div><div class="finalProgress">7 PICKS · COMPLETE</div><button class="finalSkip" id="finalSkip">次のTEAMへ</button></div>`;
  let i=0;
  const reveal=()=>{
    if(i<t.length){const el=$('#fm'+i);if(el){el.classList.add('reveal');flash()}i++;finalShowTimer=setTimeout(reveal,190);return}
    $('#finalComplete').classList.add('on');$('#finalShowcase').classList.add('finalBoom');flash();
    finalShowTimer=setTimeout(()=>showFinalTeam(pi+1),1050);
  };
  $('#finalSkip').onclick=()=>{clearTimeout(finalShowTimer);showFinalTeam(pi+1)};
  finalShowTimer=setTimeout(reveal,280);
}
function showFinalResults(){
  clearTimeout(finalShowTimer);$('#overlay').classList.remove('show');$('#result').classList.add('show');$('#result').classList.add('finalResultIn');
  $('#resultSub').textContent=`7 ROUND終了 — ${playerCount}つのDREAM TEAMが完成！`;
  $('#finalGrid').innerHTML=teams.map((t,pi)=>`<div class="finalBox"><div class="teamTitle ${pc(pi)}">${pn(pi)}</div><div class="finalCards">${t.map(m=>`<div class="finalCard"><img src="${m.img}"><div class="name">${m.name}</div></div>`).join('')}</div></div>`).join('');
  scrollTo({top:0,behavior:'smooth'});flash();
}
function flash(){$('#flash').classList.remove('on');void $('#flash').offsetWidth;$('#flash').classList.add('on')}
$('#again').onclick=start;
$('#copy').onclick=async()=>{
  const txt='BMSG DREAM DRAFT '+playerCount+'P\n\n'+teams.map((t,pi)=>
    pn(pi)+'\n'+t.map((m,i)=>(i+1)+'. '+m.name).join('\n')
  ).join('\n\n');
  try{
    await navigator.clipboard.writeText(txt);
    $('#copy').textContent='コピーしました！';
    setTimeout(()=>$('#copy').textContent='結果をコピー',1200);
  }catch(e){ alert(txt); }
};
</script></body></html>
